<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AQQI — Review des ads</title>
<style>
  :root{
    --choco:#461302; --creme:#EEDCB7; --bg:#FAF9F5; --orange:#FA4F17;
    --line:#e3dccb; --muted:#8a7f6d; --ink:#2b1a0e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
  a{color:var(--orange)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  header{background:var(--choco);color:var(--creme);padding:16px 0}
  header .wrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-family:Georgia,serif;font-size:19px;font-weight:600}
  header .sub{color:#c9ad82;font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:20px;padding-bottom:1px;scrollbar-width:thin}
  .tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:10px 16px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab.active{color:var(--choco);background:#fff;border-color:var(--choco);box-shadow:inset 0 3px 0 var(--orange)}

  .panel{display:none;background:#fff;border:1px solid var(--choco);border-radius:0 12px 12px 12px;padding:20px;margin-bottom:40px}
  .panel.active{display:block}
  .panel h2{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--choco);margin-bottom:14px}

  .framewrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#faf9f5}
  .framewrap iframe{width:100%;height:80vh;border:none;display:block}
  .zoombtn{position:absolute;top:10px;right:10px;z-index:2;background:rgba(70,19,2,.9);color:var(--creme);border:none;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .zoombtn:hover{background:var(--choco)}
  .framewrap.expanded{position:fixed;inset:0;z-index:9999;border:none;border-radius:0;background:var(--bg)}
  .framewrap.expanded iframe{height:100vh}
  .framehint{font-size:12.5px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>AQQI · Review des ads</h1>
    <span class="sub">regarde les variations, dis ta préférée sur Slack</span>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
/* Une entrée par ad. J'en rajoute au fil de l'eau. */
const ADS = [
  { id:'ad1', num:1, name:'Prix barré', file:'ad1.html' },
  { id:'ad3', num:3, name:'Payer au résultat', file:'ad3.html' },
  { id:'ad7', num:7, name:'Le canapé', file:'ad7.html' }
];

const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');

ADS.forEach((ad,i)=>{
  const tab=document.createElement('button');
  tab.className='tab'+(i===0?' active':'');
  tab.id='tab-'+ad.id;
  tab.textContent='Ad '+ad.num+' · '+ad.name;
  tab.onclick=()=>activate(ad.id);
  tabsEl.appendChild(tab);

  const panel=document.createElement('div');
  panel.className='panel'+(i===0?' active':'');
  panel.id='panel-'+ad.id;
  panel.innerHTML=
    '<h2>Ad '+ad.num+' — '+ad.name+'</h2>'+
    '<div class="framewrap" id="fw-'+ad.id+'">'+
      '<button class="zoombtn" onclick="fs(\''+ad.id+'\')">⤢ Agrandir</button>'+
      '<iframe data-src="'+ad.file+'" title="Ad '+ad.num+'"></iframe></div>'+
    '<div class="framehint">↕ Fais défiler dans le cadre pour dérouler les variations · '+
    '<a href="'+ad.file+'" target="_blank" rel="noopener">↗ nouvel onglet</a></div>';
  panelsEl.appendChild(panel);
});

loadFrame(ADS[0].id);

function activate(id){
  ADS.forEach(a=>{
    document.getElementById('tab-'+a.id).classList.toggle('active',a.id===id);
    document.getElementById('panel-'+a.id).classList.toggle('active',a.id===id);
  });
  loadFrame(id);
}
function loadFrame(id){
  const f=document.querySelector('#panel-'+id+' iframe');
  if(f && !f.src) f.src=f.dataset.src;
}
function fs(id){
  const el=document.getElementById('fw-'+id);
  const on=el.classList.toggle('expanded');
  el.querySelector('.zoombtn').textContent = on ? '✕ Fermer' : '⤢ Agrandir';
  document.body.style.overflow = on ? 'hidden' : '';
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const el=document.querySelector('.framewrap.expanded');
    if(el){el.classList.remove('expanded');el.querySelector('.zoombtn').textContent='⤢ Agrandir';document.body.style.overflow='';}
  }
});
</script>
</body>
</html>

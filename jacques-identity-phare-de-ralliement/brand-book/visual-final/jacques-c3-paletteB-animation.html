<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacques — Palette B · Faisceau lumière pâle</title>
<style>
  body {
    margin: 0;
    background: #EDE6D6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1F1A14;
    font-family: system-ui, sans-serif;
  }
  .label {
    position: fixed; top: 10px; left: 10px;
    background: rgba(31, 26, 20, 0.7); padding: 6px 12px; border-radius: 3px;
    font-size: 12px; letter-spacing: 0.05em; color: #EDE6D6;
  }
  .phare-anim { position: relative; height: 100vh; aspect-ratio: 1493 / 2000; overflow: hidden; }
  .phare-anim .bg { width: 100%; height: 100%; display: block; object-fit: cover; }
  .phare-anim .beam-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>

<div class="label">PALETTE B — Faisceau lumière pâle (presque blanc)</div>

<div class="phare-anim" id="phareAnim">
  <img class="bg" src="bg-paletteB.jpg" alt="Jacques Palette B">

  <svg class="beam-overlay" viewBox="0 0 1493 2000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="beamGradient" gradientUnits="userSpaceOnUse" x1="1429" y1="682" x2="600" y2="682">
        <stop offset="0%" stop-color="#FFFCF5" stop-opacity="1" />
        <stop offset="40%" stop-color="#F5F0E0" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#EDE6D6" stop-opacity="0" />
      </linearGradient>
      <radialGradient id="haloGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="20%" stop-color="#FFFCF5" stop-opacity="0.55" />
        <stop offset="50%" stop-color="#F5F0E0" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#EDE6D6" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="cameraGlowGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
        <stop offset="30%" stop-color="#FFFCF5" stop-opacity="0.55" />
        <stop offset="70%" stop-color="#F5F0E0" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#EDE6D6" stop-opacity="0" />
      </radialGradient>
      <filter id="softBlur" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="2" /></filter>
      <filter id="strongBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" /></filter>
      <filter id="paintedTexture" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="1.5" />
      </filter>
    </defs>

    <circle id="cameraGlow" cx="600" cy="682" r="0" fill="url(#cameraGlowGradient)" filter="url(#strongBlur)" opacity="0" />
    <polygon id="beam" points="1428,681 1430,683 604,687 600,677" fill="url(#beamGradient)" filter="url(#paintedTexture)" />
    <circle id="halo" cx="1429" cy="682" r="23" fill="url(#haloGradient)" filter="url(#softBlur)" />
  </svg>
</div>

<script>
  const PIVOT_X = 1429, PIVOT_Y = 682, radius = 1300, perspective = 0.04, transitionWidth = 0.1;
  const duration = 12000, baseWidth = 1, tipWidth = 40, depthScale = 0.5;
  const glowIntensity = 0.1, globalOpacity = 0.6, haloSize = 23;
  function smoothstep(t) { t = Math.max(0, Math.min(1, t)); return t*t*t*(t*(6*t-15)+10); }
  const beam = document.getElementById('beam'), halo = document.getElementById('halo');
  const gradient = document.getElementById('beamGradient'), cameraGlow = document.getElementById('cameraGlow');
  let startTime = null;
  function animate(t) {
    if (!startTime) startTime = t;
    const rawT = ((t - startTime) % duration) / duration;
    const angle = rawT * 2 * Math.PI;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    let perspY;
    if (sinA <= -transitionWidth) perspY = perspective;
    else if (sinA >= transitionWidth) perspY = 1.0;
    else { const t01 = (sinA + transitionWidth) / (2 * transitionWidth); perspY = perspective + (1-perspective)*smoothstep(t01); }
    const xEnd = PIVOT_X - radius * cosA;
    const yEnd = PIVOT_Y + radius * sinA * perspY;
    const dx = xEnd - PIVOT_X, dy = yEnd - PIVOT_Y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const dirX = dx/len, dirY = dy/len;
    const perpX = -dirY, perpY_perp = dirX;
    const effectiveTipWidth = tipWidth * (1 + depthScale * sinA);
    const p1x = PIVOT_X + perpX*baseWidth, p1y = PIVOT_Y + perpY_perp*baseWidth;
    const p2x = PIVOT_X - perpX*baseWidth, p2y = PIVOT_Y - perpY_perp*baseWidth;
    const p3x = xEnd - perpX*effectiveTipWidth, p3y = yEnd - perpY_perp*effectiveTipWidth;
    const p4x = xEnd + perpX*effectiveTipWidth, p4y = yEnd + perpY_perp*effectiveTipWidth;
    beam.setAttribute('points', `${p1x.toFixed(1)},${p1y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}`);
    gradient.setAttribute('x1', PIVOT_X); gradient.setAttribute('y1', PIVOT_Y);
    gradient.setAttribute('x2', xEnd); gradient.setAttribute('y2', yEnd);
    const positionalOpacity = 0.25 + 0.75 * Math.max(0, (sinA + 1) / 2);
    beam.setAttribute('opacity', (positionalOpacity * globalOpacity).toFixed(2));
    halo.setAttribute('opacity', globalOpacity.toFixed(2));
    const forwardFactor = Math.max(0, sinA);
    const glowRadius = (15 + 60 * forwardFactor) * glowIntensity;
    const glowOpacity = forwardFactor * 0.85 * glowIntensity * globalOpacity;
    cameraGlow.setAttribute('cx', xEnd); cameraGlow.setAttribute('cy', yEnd);
    cameraGlow.setAttribute('r', glowRadius.toFixed(1));
    cameraGlow.setAttribute('opacity', glowOpacity.toFixed(2));
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>

</body>
</html>
